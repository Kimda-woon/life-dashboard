<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나의 운영실</title>
  <meta name="description" content="생계 우선순위, 빚 500→0 챌린지, 10·5·1년 비전과 주간 리뷰를 한 곳에서.">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>🧭 나의 운영실</h1>
        <p id="today-label" class="muted"></p>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <nav class="tabs" aria-label="메뉴">
    <div class="wrap tabs-inner">
      <button data-tab="today"><span>☀️</span>오늘</button>
      <button data-tab="money"><span>💸</span>돈</button>
      <button data-tab="vision"><span>🔭</span>비전</button>
      <button data-tab="review"><span>📝</span>주간 리뷰</button>
      <button data-tab="settings"><span>⚙️</span>설정</button>
    </div>
  </nav>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
